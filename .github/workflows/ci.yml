name: Test

# Tests and a production build on every push. Publishing happens elsewhere:
# the FlintScope site deploy (gizmo2222/FlintScope) checks out this repo,
# builds it with BASE_PATH=/game/ and uploads it to flintscope.com/game/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
